<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starlight Browser</title>
<link rel="stylesheet" href="styles/styles.css">
</head>
<body class="browser-body">

</div>

<div class="tab-close">

<line x1="18" y1="6" x2="6" y2="18"></line>
<line x1="6" y1="6" x2="18" y2="18"></line>
</svg>
</div>
</div>
<button class="add-tab-btn" id="add-tab-btn">
<svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
<line x1="12" y1="5" x2="12" y2="19"></line>
<line x1="5" y1="12" x2="19" y2="12"></line>
</svg>
</button>
</div>
<div class="nav-bar">
<div class="nav-actions">
<button class="nav-btn" id="nav-back">
<svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
<line x1="19" y1="12" x2="5" y2="12"></line>
<polyline points="12 19 5 12 12 5"></polyline>
</svg>
</button>
<button class="nav-btn" id="nav-forward">
<svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
<line x1="5" y1="12" x2="19" y2="12"></line>
<polyline points="12 5 19 12 12 19"></polyline>
</svg>
</button>
<button class="nav-btn" id="nav-refresh">
<svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
<polyline points="23 4 23 10 17 10"></polyline>
<polyline points="1 20 1 14 7 14"></polyline>
<path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
</svg>
</button>
</div>
<div class="url-bar-container">
<div class="url-icon">
<svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
<path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
</svg>
</div>
<input type="text" class="url-input" id="url-input" value="starlight://newtab" autocomplete="off">
<button class="bookmark-star-btn" id="bookmark-star-btn">
<svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
</svg>
</button>
</div>
<div class="ext-actions">
<button class="nav-btn">
<svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
</svg>

<button class="nav-btn">
<svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
<circle cx="12" cy="12" r="3"></circle>
<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
</svg>
</button>
<button class="nav-btn">
<svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
<circle cx="12" cy="12" r="1"></circle>
<circle cx="12" cy="5" r="1"></circle>
<circle cx="12" cy="19" r="1"></circle>
</svg>
</button>
</div>
</div>
<div class="bookmarks-bar">
<div class="bookmarks-label">Bookmarks</div>
<div class="bookmarks-list" id="global-bookmarks-list">
</div>
</div>
</div>
<div class="browser-content">
<iframe id="browser-viewport" src="newtab.html" frameborder="0"></iframe>
</div>

<script src="/scramjet/scramjet.js"></script>
<script src="/controller/controller.api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@3.0.1/dist/index.js"></script>

<script>
    const { Controller } = $scramjetController;
    const { defaultConfig } = $scramjet;
    const EpoxyTransport = self.EpoxyTransport.default;

    const iframe = document.getElementById("browser-viewport");
    const urlInput = document.getElementById("url-input");

    let scramjet = null;
    let frame = null;

    
    function norm(u) {
        if (u.startsWith("starlight://") || u.startsWith("about:")) return u;
        
        if (!u.includes(".") || u.includes(" ")) return "https://duckduckgo.com/?q=" + encodeURIComponent(u);
        return u.startsWith("http") ? u : "https://" + u;
    }

    async function initScramjet() {
        try {
            await navigator.serviceWorker.ready;
            const serviceworker = navigator.serviceWorker.controller ?? (await navigator.serviceWorker.ready).active;

            const transport = new EpoxyTransport({
                wisp: "wss://nocturne.lol/wisp/"
            });

            await transport.init();

            scramjet = new Controller({
                serviceworker,
                transport,
                scramjetConfig: defaultConfig
            });

            await scramjet.wait();
            frame = scramjet.createFrame(iframe);
            console.log("Scramjet Engine Ready");

        } catch (e) {
            console.error("Scramjet Init Error:", e);
        }
    }

    
    urlInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            const url = norm(urlInput.value);
            urlInput.value = url;
            
            
            if (url === "starlight://newtab") {
                iframe.src = "newtab.html";
            } else if (frame) {
                
                frame.go(url);
            }
        }
    });

    
    document.getElementById("nav-back").addEventListener("click", () => {
        if (iframe.contentWindow) iframe.contentWindow.history.back();
    });
    
    document.getElementById("nav-forward").addEventListener("click", () => {
        if (iframe.contentWindow) iframe.contentWindow.history.forward();
    });
    
    document.getElementById("nav-refresh").addEventListener("click", () => {
        if (iframe.contentWindow) iframe.contentWindow.location.reload();
    });

    
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").then(initScramjet);
    } else {
        console.warn("Service workers not supported. Scramjet won't load.");
    }
</script>

<script src="js/particle.js"></script>
<script src="js/bookmarks.js"></script>
<script src="js/main.js"></script>
</body>
</html>
